<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · 这颗星还没有被命名</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b1a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffd76a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffd76a' stroke-opacity='.45'/%3E%3Ccircle cx='25' cy='8' r='1.6' fill='%23cdd8ff'/%3E%3Ccircle cx='7' cy='23' r='1.2' fill='%23cdd8ff'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:radial-gradient(1200px 800px at 70% -10%,#141c40,#070b1a 60%);
    color:#e9eefc;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  .stars{position:fixed;inset:0;pointer-events:none;opacity:.7}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#cdd8ff;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  .box{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px}
  .code{font-size:88px;font-weight:800;letter-spacing:6px;
    background:linear-gradient(90deg,#fff,#ffd76a);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  p{color:#93a0c8;margin:14px 0 28px;letter-spacing:1px}
  a{display:inline-block;padding:11px 24px;border:1px solid rgba(255,215,106,.5);
    border-radius:999px;color:#ffd76a;text-decoration:none;background:rgba(255,215,106,.08);
    transition:.2s}
  a:hover{background:rgba(255,215,106,.18);box-shadow:0 0 16px rgba(255,215,106,.25)}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="box">
  <div class="code">404</div>
  <p>这颗星还没有被命名 —— 页面走丢了，回展示墙看看已点亮的校园吧。</p>
  <a href="/meow-starmap/gallery/">← 回喵星系展示墙</a>
</div>
<script>
const sc=document.getElementById("stars");
for(let i=0;i<90;i++){const x=document.createElement("i");
  x.style.left=(Math.random()*100)+"%";x.style.top=(Math.random()*100)+"%";
  x.style.animationDelay=(Math.random()*4)+"s";
  x.style.transform="scale("+(0.6+Math.random()*1.4)+")";sc.appendChild(x);}
</script>
</body>
</html>
