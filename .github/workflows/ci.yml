name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Python tests (roundtrip + package builds + hosted artifacts drift)
        run: uv run --python 3.12 --with pillow python -m unittest discover -s tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Inline-script syntax gate (whole repo: templates, pages, shards)
        run: node tools/check_html_scripts.mjs .

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Chromium for Playwright
        run: uv run --python 3.12 --with playwright python -m playwright install --with-deps chromium

      - name: Headless browser smoke (gallery + /demo/ + /nuc/ lightbox)
        run: uv run --python 3.12 --with playwright python tools/ci_browser_smoke.py

      - name: Upload smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: /tmp/ci-smoke-shots
          if-no-files-found: ignore
