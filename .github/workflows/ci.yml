name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Python tests (roundtrip + package builds + hosted artifacts drift)
        run: uv run --with pillow python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Inline-script syntax gate (template + gallery + hosted builds)
        run: node tools/check_html_scripts.mjs template/starmap.html gallery index.html 404.html nuc/index.html demo/index.html
